<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя визитка</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }
        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #ffffff; }
        p.subtitle { color: #94a3b8; font-size: 15px; margin-bottom: 20px; }
        p.bio { color: #cbd5e1; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .links { display: flex; flex-direction: column; gap: 12px; }
        .btn {
            display: block;
            padding: 12px 20px;
            background: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .btn:hover { background: #475569; }
        .btn-primary { background: #6366f1; }
        .btn-primary:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">🚀</div>
        <h1>Привет! Я Георгий</h1>
        <p class="subtitle">Создатель проектов & Специалист</p>
        <p class="bio">Добро пожаловать на мою личную страницу-визитку. Здесь вы можете найти ссылки для связи со мной.</p>
        <div class="links">
            <a href="https://t.me" class="btn btn-primary" target="_blank">Написать в Telegram</a>
            <a href="https://vk.com" class="btn" target="_blank">Профиль ВКонтакте</a>
        </div>
    </div>
</body>
</html>
